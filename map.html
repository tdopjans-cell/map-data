<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    html, body { margin:0; height:100%; }
    /* schöner Hintergrund-Verlauf (kannst du später easy anpassen) */
    body {
      background: linear-gradient(140deg, #f7f7f7 0%, #ffffff 45%, #f1f1f1 100%);
    }
    #map { width:100%; height:100%; }
  </style>
</head>
<body>
<div id="map"></div>

<script>
 const STYLE_URL = "./style.json";

let currentLevel = "europe";
let currentLang = "de";

// state from Bubble
let selected = { start: null, stops: [], end: null };

const map = new maplibregl.Map({
  container: "map",
  style: STYLE_URL,
  center: [12, 52],
  zoom: 3.5,
  attributionControl: false
});

function safeSetVisibility(id, visible) {
  try {
    if (map.getLayer(id)) {
      map.setLayoutProperty(id, "visibility", visible ? "visible" : "none");
    }
  } catch (e) {
    console.warn("visibility fail", id, e);
  }
}

function setLevel(level) {
  currentLevel = level;

  const showEurope = level === "europe";
  const showGermany = level === "germany";

  safeSetVisibility("eu-countries-fill", showEurope);
  safeSetVisibility("eu-countries-line", showEurope);
  safeSetVisibility("eu-country-labels", showEurope);

  safeSetVisibility("de-states-fill", showGermany);
  safeSetVisibility("de-states-line", showGermany);
  safeSetVisibility("de-state-labels", showGermany);
  safeSetVisibility("de-places", showGermany);
  safeSetVisibility("de-place-labels", showGermany);

  if (level === "europe") map.flyTo({ center: [12, 52], zoom: 3.5, duration: 900 });
  if (level === "germany") map.flyTo({ center: [10.5, 51.2], zoom: 5.8, duration: 900 });
}

function setLanguage(lang) {
  currentLang = lang;
  // MVP: wir lassen das Style-Feld (coalesce) wie es ist.
  // Optional später: dynamisch auf NAME_DE / NAME_EN etc. umstellen.
}

async function addIconSafe(name, url) {
  try {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.src = url;
    await img.decode();
    if (!map.hasImage(name)) map.addImage(name, img);
  } catch (e) {
    console.warn("Icon konnte nicht geladen werden:", name, url);
  }
}

function updateFlagsGeojson() {
  const feats = [];

  if (selected.start && isFinite(selected.start.lng) && isFinite(selected.start.lat)) {
    feats.push({
      type: "Feature",
      geometry: { type: "Point", coordinates: [selected.start.lng, selected.start.lat] },
      properties: { role: "start" }
    });
  }

  for (const s of (selected.stops || [])) {
    if (!s || !isFinite(s.lng) || !isFinite(s.lat)) continue;
    feats.push({
      type: "Feature",
      geometry: { type: "Point", coordinates: [s.lng, s.lat] },
      properties: { role: "stop" }
    });
  }

  if (selected.end && isFinite(selected.end.lng) && isFinite(selected.end.lat)) {
    feats.push({
      type: "Feature",
      geometry: { type: "Point", coordinates: [selected.end.lng, selected.end.lat] },
      properties: { role: "end" }
    });
  }

  const fc = { type: "FeatureCollection", features: feats };
  const src = map.getSource("flags");
  if (src) src.setData(fc);
}

function updateRouteGeojson(stops) {
  const coords = (stops || [])
    .map(s => [s.lng, s.lat])
    .filter(c => isFinite(c[0]) && isFinite(c[1]));

  const fc = {
    type: "FeatureCollection",
    features: coords.length >= 2 ? [{
      type: "Feature",
      geometry: { type: "LineString", coordinates: coords },
      properties: {}
    }] : []
  };

  const src = map.getSource("route");
  if (src) src.setData(fc);
}

// Map -> Bubble (select)
map.on("click", (e) => {
  const layers = currentLevel === "germany"
    ? ["de-states-fill", "de-places"]
    : ["eu-countries-fill"];

  const feats = map.queryRenderedFeatures(e.point, { layers });
  if (!feats.length) return;

  const f = feats[0];
  const p = f.properties || {};
  const rawId =
    p.id ??
    p.ISO_A2 ??
    p.ISO_A3 ??
    p.ADM0_A3 ??
    p.ADM1_CODE ??
    p.HASC_1 ??
    p.NAME_1 ??
    p.NAME ??
    p.name;
  
  const id = rawId ? String(rawId) : `${currentLevel}:${name}`;
  const name = (p.NAME_DE || p.NAME || p.name_de || p.name || "").toString();
  const kind = (f.layer && f.layer.id === "de-places") ? "city" : "area";

  window.parent.postMessage({
    type: "select",
    payload: { id, name, kind, level: currentLevel, lng: e.lngLat.lng, lat: e.lngLat.lat }
  }, "*");
});

// Bubble -> Map
window.addEventListener("message", (ev) => {
  const msg = ev.data;
  if (!msg || typeof msg !== "object") return;

  if (msg.type === "setLevel") setLevel(msg.level);
  if (msg.type === "setLanguage") setLanguage(msg.lang);

  if (msg.type === "setSelected") {
    selected = msg.selected || { start: null, stops: [], end: null };
    updateFlagsGeojson();
  }

  if (msg.type === "setRoute") {
    updateRouteGeojson(msg.stops || []);
  }
});

map.on("load", async () => {
  // Icons liegen im Root:
  await addIconSafe("flag-start", "./flag_start.png");
  await addIconSafe("flag-stop", "./flag_stop.png");
  await addIconSafe("flag-end", "./flag_end.png");

  setLevel(currentLevel);
  updateFlagsGeojson();
});

</script>
</body>
</html>

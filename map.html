<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <style>
    html, body { margin:0; padding:0; height:100%; width:100%; }
    /* In Bubble iFrame ist 100% stabiler als 100vh */
    #wrap { position:relative; width:100%; height:100%; overflow:hidden; }
    #map { position:absolute; inset:0; }
    #routeCanvas { position:absolute; inset:0; pointer-events:none; z-index:50; }
  </style>
</head>

<body>
  <div id="wrap">
    <div id="map"></div>
    <canvas id="routeCanvas"></canvas>
  </div>

  <script>
    const STYLE_URL = "./style.json?v=1";

    let currentLevel = "europe";
    let selected = { start: null, stops: [], end: null };
    let lastRouteStops = [];

    // Hover/Selected state (separat pro Level!)
    let hoveredIdEU = null;
    let hoveredIdDE = null;

    let selectedIdEU = null;
    let selectedIdDE = null;

    const map = new maplibregl.Map({
      container: "map",
      style: STYLE_URL,
      center: [12, 52],
      zoom: 3.5,
      attributionControl: false
    });

    // ===== Canvas setup =====
    const canvas = document.getElementById("routeCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;

      // ✅ wichtig: Größe vom Map-Container nehmen
      const rect = map.getContainer().getBoundingClientRect();

      canvas.style.width = rect.width + "px";
      canvas.style.height = rect.height + "px";
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);

      // draw in CSS pixels
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function redrawAll() {
      resizeCanvas();
      drawRouteArrows();
    }

    window.addEventListener("resize", redrawAll);
    map.on("resize", redrawAll);

    // ===== Playful arrow =====
    function drawPlayfulArrow(ax, ay, bx, by, fillColor) {
      const dx = bx - ax, dy = by - ay;
      const dist = Math.hypot(dx, dy);
      if (dist < 10) return;

      const shaftW = Math.max(6, Math.min(14, dist * 0.05));
      const headL  = Math.max(18, Math.min(44, dist * 0.18));
      const headW  = shaftW * 2.4;

      const ux = dx / dist, uy = dy / dist;
      const px = -uy, py = ux;

      const endBack = 22;
      const startFwd = 22;

      const ex = bx - ux * endBack;
      const ey = by - uy * endBack;
      const sx = ax + ux * startFwd;
      const sy = ay + uy * startFwd;

      const hx = ex - ux * headL;
      const hy = ey - uy * headL;

      const sL = { x: sx + px * (shaftW/2), y: sy + py * (shaftW/2) };
      const sR = { x: sx - px * (shaftW/2), y: sy - py * (shaftW/2) };
      const hL = { x: hx + px * (shaftW/2), y: hy + py * (shaftW/2) };
      const hR = { x: hx - px * (shaftW/2), y: hy - py * (shaftW/2) };

      const kL = { x: hx + px * (headW/2), y: hy + py * (headW/2) };
      const kR = { x: hx - px * (headW/2), y: hy - py * (headW/2) };

      ctx.save();
      ctx.shadowColor = "rgba(0,0,0,0.18)";
      ctx.shadowBlur = 6;
      ctx.shadowOffsetX = 1;
      ctx.shadowOffsetY = 2;

      ctx.fillStyle = fillColor || "#39c35a";
      ctx.strokeStyle = "#0b2220";
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.moveTo(sL.x, sL.y);
      ctx.lineTo(hL.x, hL.y);
      ctx.lineTo(kL.x, kL.y);
      ctx.lineTo(ex, ey);
      ctx.lineTo(kR.x, kR.y);
      ctx.lineTo(hR.x, hR.y);
      ctx.lineTo(sR.x, sR.y);
      ctx.closePath();

      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawRouteArrows() {
      clearCanvas();
      if (!Array.isArray(lastRouteStops) || lastRouteStops.length < 2) return;

      for (let i = 0; i < lastRouteStops.length - 1; i++) {
        const a = lastRouteStops[i];
        const b = lastRouteStops[i + 1];
        if (!a || !b) continue;

        const pA = map.project([a.lng, a.lat]);
        const pB = map.project([b.lng, b.lat]);

        const color = (i === 0) ? "#39c35a" : "#f2c94c";
        drawPlayfulArrow(pA.x, pA.y, pB.x, pB.y, color);
      }
    }

    map.on("move", drawRouteArrows);
    map.on("zoom", drawRouteArrows);

    // ===== Helpers =====
    function safeSetVisibility(id, visible) {
      try {
        if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", visible ? "visible" : "none");
      } catch (e) {}
    }

    function setLevel(level) {
      currentLevel = level;

      const showEurope = level === "europe";
      const showGermany = level === "germany";

      safeSetVisibility("eu-countries-fill", showEurope);
      safeSetVisibility("eu-countries-line", showEurope);
      safeSetVisibility("eu-country-labels", showEurope);

      safeSetVisibility("de-states-fill", showGermany);
      safeSetVisibility("de-states-line", showGermany);
      safeSetVisibility("de-state-labels", showGermany);
      safeSetVisibility("de-places", showGermany);
      safeSetVisibility("de-place-labels", showGermany);

      // Hover reset
      clearHoverEU();
      clearHoverDE();

      if (level === "europe") {
        map.flyTo({ center: [12, 52], zoom: 3.5, duration: 900 });
      }
      if (level === "germany") {
        map.flyTo({ center: [10.5, 51.2], zoom: 5.8, duration: 900 });
      }

      // ✅ nach FlyTo einmal neu anpassen (Bubble resize timing)
      setTimeout(() => redrawAll(), 120);
    }

    // --- Hover handling: getrennt ---
    function clearHoverEU() {
      if (hoveredIdEU !== null && map.getSource("eu_countries")) {
        try { map.setFeatureState({ source: "eu_countries", id: hoveredIdEU }, { hover: false }); } catch(e){}
      }
      hoveredIdEU = null;
    }
    function clearHoverDE() {
      if (hoveredIdDE !== null && map.getSource("de_states")) {
        try { map.setFeatureState({ source: "de_states", id: hoveredIdDE }, { hover: false }); } catch(e){}
      }
      hoveredIdDE = null;
    }

    // --- Selected handling: getrennt ---
    function setSelectedEU(featureId) {
      if (!map.getSource("eu_countries")) return;
      if (selectedIdEU !== null) {
        try { map.setFeatureState({ source: "eu_countries", id: selectedIdEU }, { selected: false }); } catch(e){}
      }
      selectedIdEU = featureId;
      if (selectedIdEU !== null) {
        try { map.setFeatureState({ source: "eu_countries", id: selectedIdEU }, { selected: true }); } catch(e){}
      }
    }

    function setSelectedDE(featureId) {
      if (!map.getSource("de_states")) return;
      if (selectedIdDE !== null) {
        try { map.setFeatureState({ source: "de_states", id: selectedIdDE }, { selected: false }); } catch(e){}
      }
      selectedIdDE = featureId;
      if (selectedIdDE !== null) {
        try { map.setFeatureState({ source: "de_states", id: selectedIdDE }, { selected: true }); } catch(e){}
      }
    }

    async function addIconSafe(name, url) {
      try {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = url;
        await img.decode();
        if (!map.hasImage(name)) map.addImage(name, img);
      } catch (e) {
        console.warn("Icon load fail", name, url, e);
      }
    }

    function updateFlagsGeojson() {
      const feats = [];

      if (selected.start && isFinite(selected.start.lng) && isFinite(selected.start.lat)) {
        feats.push({
          type: "Feature",
          geometry: { type: "Point", coordinates: [selected.start.lng, selected.start.lat] },
          properties: { role: "start" }
        });
      }

      for (const s of (selected.stops || [])) {
        if (!s || !isFinite(s.lng) || !isFinite(s.lat)) continue;
        feats.push({
          type: "Feature",
          geometry: { type: "Point", coordinates: [s.lng, s.lat] },
          properties: { role: "stop" }
        });
      }

      if (selected.end && isFinite(selected.end.lng) && isFinite(selected.end.lat)) {
        feats.push({
          type: "Feature",
          geometry: { type: "Point", coordinates: [selected.end.lng, selected.end.lat] },
          properties: { role: "end" }
        });
      }

      const fc = { type: "FeatureCollection", features: feats };
      const src = map.getSource("flags");
      if (src) src.setData(fc);
    }

    // ===== Hover effect =====
    map.on("mousemove", (e) => {
      const layerId = (currentLevel === "germany") ? "de-states-fill" : "eu-countries-fill";
      if (!map.getLayer(layerId)) return;

      const feats = map.queryRenderedFeatures(e.point, { layers: [layerId] });
      if (!feats.length) {
        clearHoverEU();
        clearHoverDE();
        return;
      }

      const f = feats[0];
      const fid = (f.id !== undefined && f.id !== null) ? f.id : null;

      if (currentLevel === "europe") {
        if (hoveredIdEU !== null && hoveredIdEU !== fid) {
          try { map.setFeatureState({ source: "eu_countries", id: hoveredIdEU }, { hover: false }); } catch(e){}
        }
        hoveredIdEU = fid;
        if (hoveredIdEU !== null) {
          try { map.setFeatureState({ source: "eu_countries", id: hoveredIdEU }, { hover: true }); } catch(e){}
        }
      } else {
        if (hoveredIdDE !== null && hoveredIdDE !== fid) {
          try { map.setFeatureState({ source: "de_states", id: hoveredIdDE }, { hover: false }); } catch(e){}
        }
        hoveredIdDE = fid;
        if (hoveredIdDE !== null) {
          try { map.setFeatureState({ source: "de_states", id: hoveredIdDE }, { hover: true }); } catch(e){}
        }
      }
    });

    map.on("mouseleave", () => {
      clearHoverEU();
      clearHoverDE();
    });

    // ===== Click -> Bubble select + highlight =====
    map.on("click", (e) => {
      const layers = currentLevel === "germany"
        ? ["de-states-fill", "de-places"]
        : ["eu-countries-fill"];

      if (!layers.every(id => map.getLayer(id))) return;

      const feats = map.queryRenderedFeatures(e.point, { layers });
      if (!feats.length) return;

      const f = feats[0];
      const p = f.properties || {};

      // highlight polygon if area
      const isArea = (f.geometry && (f.geometry.type === "Polygon" || f.geometry.type === "MultiPolygon"));
      if (currentLevel === "germany") {
      console.log("DE click:", "feature.id=", f.id, "ISO_3166_2=", (p.ISO_3166_2 || null));
    }
      if (isArea && f.id !== undefined && f.id !== null) {
        if (currentLevel === "europe") setSelectedEU(f.id);
        if (currentLevel === "germany") setSelectedDE(f.id);
      }

      const name =
        currentLevel === "germany"
          ? String(p.NAME_1 || p.NAME_DE || p.NAME || p.name_de || p.name || "")
          : String(p.NAME_DE || p.NAME || p.name_de || p.name || "");

      const kind = (f.layer && f.layer.id === "de-places") ? "city" : "area";
      
      const id =
        kind === "city"
          ? String(p.id || p.ID || name) // aus de_places.json
          : (currentLevel === "europe"
              ? String(p.ISO_A2 || name)
              : String(p.iso_3166_2 || p.ISO_3166_2 || name));

      window.parent.postMessage({
        type: "select",
        payload: { id, name, kind, level: currentLevel, lng: e.lngLat.lng, lat: e.lngLat.lat }
      }, "*");
    });

    // ===== Bubble -> Map messages =====
    window.addEventListener("message", (ev) => {
      const msg = ev.data;
      if (!msg || typeof msg !== "object") return;

      if (msg.type === "setLevel") setLevel(msg.level);

      if (msg.type === "flyTo") {
        if (Number.isFinite(msg.lng) && Number.isFinite(msg.lat)) {
          map.flyTo({
            center: [msg.lng, msg.lat],
            zoom: msg.zoom || (currentLevel === "germany" ? 6.5 : 4.5),
            duration: 900
          });
          setTimeout(() => redrawAll(), 120);
        }
      }

      if (msg.type === "setSelected") {
        selected = msg.selected || { start: null, stops: [], end: null };
        updateFlagsGeojson();
      }

      if (msg.type === "setRoute") {
        lastRouteStops = (msg.stops || [])
          .filter(p => p && Number.isFinite(p.lng) && Number.isFinite(p.lat));
        // ✅ ganz wichtig gegen “oben links”
        redrawAll();
      }
    });

    map.on("load", async () => {
      redrawAll();

      await addIconSafe("flag-start", "./flag_start.png");
      await addIconSafe("flag-stop", "./flag_stop.png");
      await addIconSafe("flag-end", "./flag_end.png");

      setLevel(currentLevel);
      updateFlagsGeojson();
      drawRouteArrows();

      // Bubble/iFrame Layout kann noch nachziehen
      setTimeout(() => redrawAll(), 250);
    });
    // Bubble/Wrapper Resize-Kick
    window.addEventListener("message", (ev) => {
      if (ev.data && ev.data.type === "forceResize") {
        try { map.resize(); } catch(e) {}
        try { redrawAll && redrawAll(); } catch(e) {}
      }
    });
  </script>
</body>
</html>
